<style>
/* Layout: app de celular de una columna (máx 520px), barra superior con marca del comercio, navegación inferior fija. */
:root{
  --brand:#000A3F; --brand-ink:#FFFFFF; --accent:#37899F; --accent-soft:#E3F1F4;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF2F6; --line:#DCE3EA;
  --fg:#0E1726; --muted:#5B6878;
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#0B1550; --brand-ink:#FFFFFF; --accent:#5BB3C9; --accent-soft:#12333D;
  --bg:#0A0F1C; --surface:#121A2B; --surface-2:#1A2438; --line:#26324A;
  --fg:#E8EDF5; --muted:#93A0B4;
  --ok:#4ADE80; --ok-soft:#10301E; --warn:#FBBF24; --warn-soft:#33270B; --bad:#F87171; --bad-soft:#3A1414;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#0B1550; --brand-ink:#FFFFFF; --accent:#5BB3C9; --accent-soft:#12333D;
  --bg:#0A0F1C; --surface:#121A2B; --surface-2:#1A2438; --line:#26324A;
  --fg:#E8EDF5; --muted:#93A0B4;
  --ok:#4ADE80; --ok-soft:#10301E; --warn:#FBBF24; --warn-soft:#33270B; --bad:#F87171; --bad-soft:#3A1414;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- login ---------- */

.login-logo img{width:100%;height:100%;object-fit:contain}
.login-card h1{margin:0;text-align:center;font-size:22px;font-weight:800;text-wrap:balance}
.login-card p.sub{margin:-8px 0 4px;text-align:center;color:var(--muted);font-size:14px}

.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}

.btn-primary{background:var(--brand);color:var(--brand-ink)}

/* ---------- nav ---------- */

nav.bot button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:30px;font-weight:500;box-shadow:0 10px 24px rgba(55,137,159,.45);display:grid;place-items:center}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,10,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-height:92%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px}
.install{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px}
.install p{margin:0;flex:1;font-size:13.5px}
footer.by2{text-align:center;font-size:12px;color:var(--muted);padding-block:6px 4px}
.ticket{background:#fff;color:#111;border:1px dashed #9AA6B2;border-radius:12px;padding:16px;font-size:14px;display:grid;gap:8px}
.ticket .th{display:flex;gap:10px;align-items:center;border-bottom:1px dashed #9AA6B2;padding-bottom:10px}

.ticket .row2{display:flex;justify-content:space-between;gap:10px}
.ticket .tot{font-size:20px;font-weight:800;border-top:1px dashed #9AA6B2;padding-top:8px}
.ticket .foot{font-size:11px;color:#6B7280;text-align:center;border-top:1px dashed #9AA6B2;padding-top:8px}
.ticket table{width:100%;border-collapse:collapse;font-size:13px}.ticket td{padding:3px 0}.ticket td:last-child{text-align:right}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

footer.by2 b{letter-spacing:.08em;color:var(--fg)}
/* v3 */
.srch{display:flex;gap:8px}.srch .in{flex:1}.srch .btn{padding:10px 14px;font-size:20px;line-height:1}

.res button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--accent-soft);border:0;border-radius:10px;padding:10px 12px;font-weight:600}

.cart{display:grid;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px}

.ci .pr{padding:8px;font-size:14px;text-align:right}
.step{display:flex;align-items:center;gap:6px}.step button{width:36px;height:36px;border-radius:10px;border:0;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:800}
.step b{min-width:26px;text-align:center}.step.big .in{text-align:center;font-size:20px;font-weight:700}.step.big button{width:48px;height:48px;flex:none}
.tot2{display:grid;align-content:end;justify-items:end;background:var(--surface-2);border-radius:12px;padding:8px 12px}.tot2 span{font-size:12px;color:var(--muted);font-weight:600}.tot2 b{font-size:22px}
details.libre{background:var(--surface-2);border-radius:12px;padding:10px 12px}details.libre summary{font-weight:700;cursor:pointer}details.libre[open]{display:grid;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted)}

.rowbtn{width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 .btn{padding:12px 6px}

<script>
/* =====================================================================
   KIT ORDEN APP · Nexovar
   Modo DEMO: datos de ejemplo en memoria (usuario demo / demo1234).
   Modo REAL: definir window.KIT_API_URL (Apps Script) antes de este script.
   ===================================================================== */
const API_URL = window.KIT_API_URL || "";
const DEMO = !API_URL;
const $ = (s, el=document) => el.querySelector(s);
const fmt = n => "$ " + Math.round(n||0).toLocaleString("es-AR");
const pct = n => (n==null||!isFinite(n)) ? "–" : Math.round(n*100) + "%";
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const iso = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const parseD = s => { if(!s) return null; if(s instanceof Date) return s; const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const dmy = s => { const d=parseD(s); return d? String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0") : ""; };
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

const DEFAULT_LOGO = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#E3F1F4"/><path d="M14 46V26l18-10 18 10v20" fill="none" stroke="#000A3F" stroke-width="4" stroke-linejoin="round"/><rect x="25" y="32" width="14" height="14" rx="2" fill="#37899F"/></svg>');

/* ---------------- datos demo (fechas relativas a hoy) ---------------- */
function demoData(){
  const t = today(), d = n => iso(addDays(t,n));
  const m0 = new Date(t.getFullYear(), t.getMonth(), 1);
  const md = (mOff, day) => iso(new Date(t.getFullYear(), t.getMonth()+mOff, Math.min(day, 28)));
  const caja = [];
  for (let mo=-5; mo<=0; mo++){
    const f = 1 + (mo+5)*0.05;
    caja.push({fecha:md(mo,1),tipo:"Egreso",categoria:"Alquiler",detalle:"Alquiler del local",medio:"Transferencia",monto:380000});
    caja.push({fecha:md(mo,4),tipo:"Egreso",categoria:"Mercadería / proveedores",detalle:"Distribuidora - pedido",medio:"Transferencia",monto:Math.round(1050000*f)});
    caja.push({fecha:md(mo,9),tipo:"Egreso",categoria:"Luz, gas, internet",detalle:"Servicios",medio:"Débito",monto:Math.round(92000*f)});
    caja.push({fecha:md(mo,10),tipo:"Egreso",categoria:"Impuestos y monotributo",detalle:"Monotributo",medio:"Débito",monto:62000});
    if (mo<0){
      caja.push({fecha:md(mo,15),tipo:"Ingreso",categoria:"Ventas",detalle:"Ventas 1ra quincena",medio:"Efectivo",monto:Math.round(1020000*f)});
      caja.push({fecha:md(mo,15),tipo:"Ingreso",categoria:"Ventas",detalle:"Ventas 1ra quincena",medio:"Mercado Pago / QR",monto:Math.round(690000*f)});
      caja.push({fecha:md(mo,28),tipo:"Ingreso",categoria:"Ventas",detalle:"Ventas 2da quincena",medio:"Efectivo",monto:Math.round(980000*f)});
      caja.push({fecha:md(mo,28),tipo:"Ingreso",categoria:"Ventas",detalle:"Ventas 2da quincena",medio:"Mercado Pago / QR",monto:Math.round(640000*f)});
      caja.push({fecha:md(mo,28),tipo:"Egreso",categoria:"Retiro del dueño",detalle:"Retiro mensual",medio:"Efectivo",monto:520000});
    }
  }
  // mes actual: ventas diarias hasta hoy

const api = {
  async call(payload){
    const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});

    if (!j.ok) throw new Error(j.error || "Error del servidor");

    TOKEN = j.token; store.set("ko_token", TOKEN);
    return norm((await api.call({action:"data", token:TOKEN})).data);
  },
  async resume(){
    if (DEMO) return null;
    const t = store.get("ko_token"); if (!t) return null;
    try{ TOKEN=t; return norm((await api.call({action:"data", token:t})).data); }catch(e){ store.del("ko_token"); return null; }
  },
  async add(sheet, row){
    if (!DEMO) await api.call({action:"add", token:TOKEN, sheet, row});
  },
  async update(sheet, key, changes){
    if (!DEMO) await api.call({action:"update", token:TOKEN, sheet, key, changes});
  },
  async addMany(items){ if (!DEMO && items.length) await api.call({action:"addMany", token:TOKEN, items}); },
  async updateMany(items){ if (!DEMO && items.length) await api.call({action:"updateMany", token:TOKEN, items}); }
};

/* ---------------- cálculos ---------------- */
const monthStart = (off=0) => { const t=today(); return new Date(t.getFullYear(), t.getMonth()+off, 1); };
function sumCaja(from, to, tipo, filter){
  return S.caja.filter(r => { const d=parseD(r.fecha); return d>=from && d<to && r.tipo===tipo && (!filter||filter(r)); })
              .reduce((a,r)=>a+Number(r.monto||0),0);
}
function resumen(off=0){
  const a=monthStart(off), b=monthStart(off+1);
  const ing=sumCaja(a,b,"Ingreso"), gas=sumCaja(a,b,"Egreso",r=>r.categoria!=="Retiro del dueño"), ret=sumCaja(a,b,"Egreso",r=>r.categoria==="Retiro del dueño");
  return {ing, gas, gan:ing-gas, margen: ing? (ing-gas)/ing : null, ret};
}
function saldoCaja(){ return S.caja.reduce((a,r)=>a+(r.tipo==="Ingreso"?1:-1)*Number(r.monto||0),0); }
function fiadoEstado(){
  const t=today(), lim=Number(S.config.limiteFiado||0), dias=Number(S.config.diasReclamar||30);
  return S.fiadoClientes.map(c=>{
    const mv=S.fiadoMov.filter(m=>m.cliente===c.cliente);
    const fiado=mv.filter(m=>m.tipo==="Fiado").reduce((a,m)=>a+Number(m.monto),0);
    const pago=mv.filter(m=>m.tipo==="Pago").reduce((a,m)=>a+Number(m.monto),0);
    const saldo=fiado-pago;
    const pagos=mv.filter(m=>m.tipo==="Pago").map(m=>parseD(m.fecha)).sort((x,y)=>y-x);
    const fiados=mv.filter(m=>m.tipo==="Fiado").map(m=>parseD(m.fecha)).sort((x,y)=>x-y);
    const ref = pagos[0] || fiados[0];
    const diasSin = saldo>0 && ref ? Math.round((t-ref)/864e5) : 0;
    const l = c.limite ? Number(c.limite) : lim;
    const estado = saldo<=0 ? "Al día" : (l && saldo>l ? "Pasó el límite" : (diasSin>dias ? "Reclamar" : "Debe"));
    return {...c, saldo, diasSin, estado, ultimoPago: pagos[0]||null};
  });
}
function stockEstado(){
  return S.stock.map(p=>{
    const mv=S.stockMov.filter(m=>m.producto===p.producto);
    const s=k=>mv.filter(m=>m.tipo===k).reduce((a,m)=>a+Number(m.cantidad),0);
    const actual=Number(p.inicial||0)+s("Entrada")-s("Salida")+s("Ajuste");
    const estado= actual<=0 ? "SIN STOCK" : (actual<=Number(p.minimo||0) ? "REPONER" : "OK");
    const margen= p.precio ? (p.precio-p.costo)/p.precio : null;
    return {...p, actual, estado, margen, valor: actual*Number(p.costo||0)};
  });
}

function chartHTML(){
  const months=[-5,-4,-3,-2,-1,0].map(o=>({o, r:resumen(o), d:monthStart(o)}));
  const max=Math.max(1,...months.map(m=>Math.max(m.r.ing,m.r.gas)));
  const W=320,H=130,pad=18,bw=16,step=(W-pad*2)/6;
  const mn=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  let g="";
  [0.5,1].forEach(f=>{ const y=H-22-(H-34)*f; g+=`<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; });
  months.forEach((m,i)=>{
    const x=pad+step*i+step/2, h1=(H-34)*m.r.ing/max, h2=(H-34)*m.r.gas/max;
    g+=`<rect x="${x-bw-1}" y="${H-22-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--accent)"/>`;
    g+=`<rect x="${x+1}" y="${H-22-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--brand)" opacity=".85"/>`;
    g+=`<text x="${x}" y="${H-6}" text-anchor="middle">${mn[m.d.getMonth()]}${m.o===0?"*":""}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">${g}</svg>
  <div class="mini" style="display:flex;gap:14px;flex-wrap:wrap"><span><b style="color:var(--accent)">■</b> Ingresos</span><span><b style="color:var(--brand)">■</b> Gastos del negocio</span><span>* mes en curso</span></div>`;
}

      <button class="btn btn-ghost" style="padding:6px 10px;font-size:12.5px" type="button" data-cuenta="${esc(c.cliente)}">Estado de cuenta</button></div></div>`).join("")}

function vStock(){

  if(!cats.includes(stockCat)) stockCat="Todas";
  const st=all.filter(p=>stockCat==="Todas"||p.categoria===stockCat).sort((a,b)=>ord[a.estado]-ord[b.estado]||a.producto.localeCompare(b.producto));
  const cls={"OK":"ok","REPONER":"warn","SIN STOCK":"bad"};

  return `

    <div class="k"><span>Para reponer</span><b class="num">${pedido.length}</b></div>
    <div class="k"><span>Mercadería a costo</span><b class="num">${fmt(valor)}</b></div>
  </div>

  ${cats.length>2?`<div class="chips">${cats.map(c=>`<button type="button" data-sc="${esc(c)}" aria-pressed="${stockCat===c}">${esc(c)}</button>`).join("")}</div>`:""}
  <div class="list" id="stList">${st.length?st.map(p=>`

      <div style="display:grid;gap:4px;justify-items:end"><b class="num" style="font-size:18px">${fmtQ(p.actual)}</b><span class="chip ${cls[p.estado]}">${p.estado}</span></div></button>`).join(""):`<div class="empty">No hay productos cargados.</div>`}
  </div>
  <p class="mini">Tocá un producto para sumar, restar, contar o cambiarle el precio.</p>
  ${pedido.length?`<button class="btn btn-wa" type="button" id="copyPedido">Copiar lista de pedido</button>`:""}
  <div class="grid2"><button class="btn btn-ghost" type="button" data-add="producto">+ Nuevo producto</button><button class="btn btn-ghost" type="button" data-add="precios">Actualizar precios %</button></div>`;

function vTurnos(){
  const t=today(); const iT=iso(t), emps=EMPS();
  if(turnoProf!=="Todos" && !emps.includes(turnoProf)) turnoProf="Todos";
  const fp=x=>turnoProf==="Todos"||x.profesional===turnoProf;
  const up=S.turnos.filter(x=>parseD(x.fecha)>=t && x.estado!=="Cancelado" && fp(x)).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const a=monthStart(0); const mes=S.turnos.filter(x=>parseD(x.fecha)>=a && parseD(x.fecha)<t && fp(x));
  const aus=mes.filter(x=>x.estado==="Ausente").length, asis=mes.filter(x=>x.estado==="Asistió").length;
  const cls={"Reservado":"neu","Confirmado":"ok","Asistió":"ok","Ausente":"bad","Cancelado":"neu"};
  const groups={}; up.forEach(x=>(groups[x.fecha]=groups[x.fecha]||[]).push(x));
  const dname=s=>{ const d=parseD(s); if (s===iT) return "Hoy"; if (s===iso(addDays(t,1))) return "Mañana"; return d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"short"}); };
  const man=iso(addDays(t,1)), manana=(groups[man]||[]);
  const hoyAll=S.turnos.filter(x=>x.fecha===iT && x.estado!=="Cancelado");
  const porProf=emps.map(e=>e+" "+hoyAll.filter(x=>x.profesional===e).length).join(" · ");
  const remHTML = manana.length ? `<section class="rem"><h3>Recordar los turnos de mañana (${manana.length})</h3>
    ${manana.map(x=>`<div class="it" style="background:var(--surface);border-radius:12px"><div class="m"><b>${esc(x.hora)} · ${esc(x.cliente)}</b><span>${esc(x.servicio)}${x.profesional?" · "+esc(x.profesional):""}${x.email?" · 📧 se le recuerda por mail automático":""}${String(x.recordado||"").includes("WA")?" · ✓ recordado por WhatsApp":""}</span></div>
    ${x.whatsapp?`<a class="wa" target="_blank" rel="noopener" data-recordar="${esc(x.fecha+"|"+x.hora+"|"+x.cliente)}" href="${esc(waLink(x.whatsapp,msgRecordatorio(x)))}">WhatsApp</a>`:""}</div>`).join("")}</section>` : "";
  return `
  ${remHTML}
  <div class="split">
    <div class="k"><span>Turnos hoy</span><b class="num">${(groups[iT]||[]).length}</b>${emps.length&&turnoProf==="Todos"?`<span>${esc(porProf)}</span>`:""}</div>
    <div class="k"><span>Ausentismo del mes</span><b class="num">${(aus+asis)?pct(aus/(aus+asis)):"–"}</b></div>
  </div>
  ${emps.length?`<div class="chips">${["Todos",...emps].map(e=>`<button type="button" data-tp="${esc(e)}" aria-pressed="${turnoProf===e}">${esc(e)}</button>`).join("")}</div>`:""}
  <button class="btn btn-primary" type="button" data-add="turno">+ Nuevo turno</button>
  ${Object.keys(groups).length? Object.entries(groups).map(([f,xs])=>`
    <h2 class="sec">${esc(dname(f))}</h2>
    <div class="list">${xs.map(x=>`
      <div class="it"><div class="ico n num" style="font-size:12px">${esc(x.hora)}</div>
        <div class="m"><b>${esc(x.cliente)}</b><span>${esc(x.servicio)} · ${fmt(x.precio)}${Number(x.sena)?" · seña "+fmt(x.sena):""} · ${Number(x.duracion)||30} min</span><br>${x.profesional?`<span class="prof">${esc(x.profesional)}</span> `:""}<span class="chip ${cls[x.estado]}">${esc(x.estado)}</span></div>
        <div style="display:grid;gap:6px;justify-items:end">
          ${x.whatsapp?`<a class="wa" target="_blank" rel="noopener" data-recordar="${esc(x.fecha+"|"+x.hora+"|"+x.cliente)}" href="${esc(waLink(x.whatsapp,msgRecordatorio(x)))}">Recordar</a>`:""}
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12.5px" type="button" data-turno="${esc(x.fecha+"|"+x.hora+"|"+x.cliente)}">Estado</button>
        </div></div>`).join("")}</div>`).join("") : `<div class="list"><div class="empty">No hay turnos próximos${turnoProf!=="Todos"?" para "+esc(turnoProf):""}. Tocá + para dar uno.</div></div>`}`;
}

/* ---------------- formularios ---------------- */
function opts(arr, sel){ return arr.map(o=>`<option ${o===sel?"selected":""}>${esc(o)}</option>`).join(""); }
function sheet(title, body, onSave){
  $("#modal").innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="sheetForm"><h3>${esc(title)}</h3>${body}
    <p class="err" id="formErr"></p>
    <div class="grid2"><button class="btn btn-ghost" type="button" id="cancel">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div></form></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#cancel").onclick=close;
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") close(); });
  $("#sheetForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const fd=Object.fromEntries(new FormData(e.target).entries());
    try{ const msg=await onSave(fd); close(); render(); toast(msg||"Guardado"); }
    catch(err){ $("#formErr").textContent=err.message; }
  });
  const first=$("#sheetForm input, #sheetForm select"); if(first) setTimeout(()=>first.focus(),50);
}
const money = v => { const n=Number(String(v).replace(/\./g,"").replace(",",".").replace(/[^\d.-]/g,"")); if(!isFinite(n)||n<=0) throw new Error("Poné un monto válido, solo números."); return n; };
const C = () => S.config;
const ingresoCats = () => C().categorias.filter(c=>["Ventas","Servicios","Cobro de fiado","Otros ingresos"].includes(c));
const egresoCats = () => C().categorias.filter(c=>!["Ventas","Servicios","Cobro de fiado","Otros ingresos"].includes(c));

function openAdd(kind){
  if (kind==="venta"){ openVenta(); return; }
  if (kind==="pedido"){ openPedido(); return; }
  if (kind==="precios"){ openPrecios(); return; }
  const hoy=iso(today());
  const fecha=`<label class="f" for="f_fecha">Fecha<input class="in" id="f_fecha" type="date" name="fecha" value="${hoy}" required></label>`;
  if (kind==="ingreso"||kind==="egreso"){
    const isIn=kind==="ingreso";
    sheet(isIn?"Cargar ingreso":"Cargar gasto o retiro", `
      <label class="f" for="f_monto">Monto<input class="in num" id="f_monto" name="monto" inputmode="decimal" placeholder="Ej: 85000" required></label>
      <div class="grid2"><label class="f" for="f_cat">Categoría<select class="in" id="f_cat" name="categoria">${opts(isIn?ingresoCats():egresoCats())}</select></label>

      async d=>{ const row={fecha:d.fecha,tipo:isIn?"Ingreso":"Egreso",categoria:d.categoria,detalle:d.detalle||d.categoria,medio:d.medio,monto:money(d.monto)};
        await api.add("CAJA",row); S.caja.push(row); return isIn?"Ingreso cargado":"Gasto cargado"; });
  }
  else if (kind==="fiado"||kind==="pago"){
    const cl=S.fiadoClientes.map(c=>c.cliente);
    if(!cl.length){ openAdd("cliente"); return; }
    sheet(kind==="fiado"?"Anotar fiado":"Registrar pago de fiado", `
      <label class="f" for="f_cli">Cliente<select class="in" id="f_cli" name="cliente">${opts(cl)}</select></label>
      <label class="f" for="f_monto">Monto<input class="in num" id="f_monto" name="monto" inputmode="decimal" required></label>
      <label class="f" for="f_det">Detalle<input class="in" id="f_det" name="detalle" placeholder="${kind==="fiado"?"Compra semanal":"Pago a cuenta"}"></label>${fecha}
      ${kind==="pago"?`<p class="mini">El pago también se suma a la Caja como "Cobro de fiado" en efectivo.</p>`:""}`,
      async d=>{ const row={fecha:d.fecha,cliente:d.cliente,tipo:kind==="fiado"?"Fiado":"Pago",detalle:d.detalle||"",monto:money(d.monto)};
        await api.add("FIADO_MOV",row); S.fiadoMov.push(row);
        if(kind==="pago"){ const c={fecha:d.fecha,tipo:"Ingreso",categoria:"Cobro de fiado",detalle:"Pago de "+d.cliente,medio:"Efectivo",monto:row.monto}; await api.add("CAJA",c); S.caja.push(c); }
        setTimeout(()=>openTicket(row),60);
        return kind==="fiado"?"Fiado anotado":"Pago registrado"; });
  }
  else if (kind==="cliente"){
    sheet("Nuevo cliente de fiado", `
      <label class="f" for="f_cli">Nombre<input class="in" id="f_cli" name="cliente" required></label>
      <label class="f" for="f_wa">WhatsApp (sin 0 ni 15)<input class="in num" id="f_wa" name="whatsapp" inputmode="tel" placeholder="1123456789"></label>
      <label class="f" for="f_lim">Límite propio (opcional)<input class="in num" id="f_lim" name="limite" inputmode="decimal"></label>`,
      async d=>{ if(S.fiadoClientes.some(c=>c.cliente.toLowerCase()===d.cliente.trim().toLowerCase())) throw new Error("Ya existe un cliente con ese nombre.");
        const row={cliente:d.cliente.trim(),whatsapp:d.whatsapp.replace(/\D/g,""),limite:d.limite?money(d.limite):""};
        await api.add("FIADO",row); S.fiadoClientes.push(row); return "Cliente agregado"; });
  }
  else if (kind==="entrada"||kind==="salida"){
    sheet(kind==="entrada"?"Llegó mercadería":"Salida de mercadería", `
      <label class="f" for="f_prod">Producto<select class="in" id="f_prod" name="producto">${opts(S.stock.map(p=>p.producto))}</select></label>
      <label class="f" for="f_cant">Cantidad<input class="in num" id="f_cant" name="cantidad" inputmode="numeric" required></label>
      <label class="f" for="f_nota">Nota<input class="in" id="f_nota" name="nota" placeholder="${kind==="entrada"?"Pedido distribuidora":"Ventas de la semana"}"></label>${fecha}`,
      async d=>{ const q=Number(d.cantidad); if(!q||q<0) throw new Error("Poné una cantidad válida.");
        const row={fecha:d.fecha,producto:d.producto,tipo:kind==="entrada"?"Entrada":"Salida",cantidad:q,nota:d.nota||""};
        await api.add("STOCK_MOV",row); S.stockMov.push(row); return "Stock actualizado"; });
  }
  else if (kind==="producto"){
    sheet("Nuevo producto", `
      <label class="f" for="f_prod">Producto<input class="in" id="f_prod" name="producto" required></label>
      <div class="grid2"><label class="f" for="f_cod">Código de barras (opcional)<input class="in num" id="f_cod" name="codigo" inputmode="numeric"></label>
      <label class="f" for="f_catp">Categoría<input class="in" id="f_catp" name="categoria" list="f_catpl" placeholder="Otros"><datalist id="f_catpl">${[...new Set(S.stock.map(x=>x.categoria).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label></div>
      <div class="grid2"><label class="f" for="f_cos">Costo<input class="in num" id="f_cos" name="costo" inputmode="decimal" required></label>
      <label class="f" for="f_pre">Precio de venta<input class="in num" id="f_pre" name="precio" inputmode="decimal" required></label>
      <label class="f" for="f_ini">Stock de hoy<input class="in num" id="f_ini" name="inicial" inputmode="numeric" required></label>
      <label class="f" for="f_min">Mínimo para pedir<input class="in num" id="f_min" name="minimo" inputmode="numeric" required></label></div>`,
      async d=>{ if(S.stock.some(x=>x.producto.toLowerCase()===d.producto.trim().toLowerCase())) throw new Error("Ya existe un producto con ese nombre.");
        const row={codigo:(d.codigo||"").trim(),producto:d.producto.trim(),categoria:(d.categoria||"").trim()||"Otros",costo:money(d.costo),precio:money(d.precio),inicial:Number(d.inicial)||0,minimo:Number(d.minimo)||0};
        await api.add("STOCK",row); S.stock.push(row); return "Producto agregado"; });
  }
  else if (kind==="turno"){
    const sv=C().servicios||[];
    sheet("Nuevo turno", `
      <label class="f" for="f_cli">Cliente<input class="in" id="f_cli" name="cliente" required></label>
      <label class="f" for="f_wa">WhatsApp (sin 0 ni 15)<input class="in num" id="f_wa" name="whatsapp" inputmode="tel"></label>
      <label class="f" for="f_mail">Mail (opcional: le llega un recordatorio automático el día anterior)<input class="in" id="f_mail" name="email" type="email" inputmode="email"></label>
      <div class="grid2">${fecha}<label class="f" for="f_hora">Hora<input class="in" id="f_hora" type="time" name="hora" value="10:00" required></label></div>
      <div class="grid2"><label class="f" for="f_sv">Servicio<select class="in" id="f_sv" name="servicio">${sv.map(s=>`<option value="${esc(s.nombre)}">${esc(s.nombre)} · ${s.minutos||30} min</option>`).join("")}</select></label>
      <label class="f" for="f_sena">Seña (opcional)<input class="in num" id="f_sena" name="sena" inputmode="decimal"></label></div>
      ${EMPS().length?`<label class="f" for="f_prof">Profesional<select class="in" id="f_prof" name="profesional"><option value="Cualquiera">Cualquiera que esté libre</option>${opts(EMPS(), turnoProf!=="Todos"?turnoProf:"")}</select></label>`:""}`,
      async d=>{ const s=sv.find(x=>x.nombre===d.servicio)||{precio:0,minutos:30}; const dur=Number(s.minutos)||30;
        let prof="";
        if(EMPS().length){ const r=asignar(d.profesional,d.fecha,d.hora,dur);
          if(!r.prof) throw new Error((d.profesional&&d.profesional!=="Cualquiera"?d.profesional+" ya tiene un turno a esa hora.":"No hay nadie libre a esa hora.")+(r.sug?" Primer horario libre: "+r.sug+".":""));
          prof=r.prof; }
        const row={fecha:d.fecha,hora:d.hora,cliente:d.cliente.trim(),whatsapp:d.whatsapp.replace(/\D/g,""),email:(d.email||"").trim(),servicio:d.servicio,precio:s.precio,sena:d.sena?money(d.sena):0,estado:"Reservado",recordado:"",profesional:prof,duracion:dur};
        await api.add("TURNOS",row); S.turnos.push(row); setTimeout(()=>avisoTurno(row),60); return "Turno agendado"+(prof?" con "+prof:""); });
  }
}
function openTurnoEstado(key){
  const [f,h,c]=key.split("|"); const t=S.turnos.find(x=>x.fecha===f&&x.hora===h&&x.cliente===c); if(!t) return;
  sheet("Turno · "+c, `<p class="mini" style="margin:0">${esc(t.servicio)} · ${dmy(t.fecha)} ${esc(t.hora)} · ${fmt(t.precio)}${Number(t.sena)?" (seña "+fmt(t.sena)+")":""}</p>
    <label class="f" for="f_est">Estado<select class="in" id="f_est" name="estado">${opts(["Reservado","Confirmado","Asistió","Ausente","Cancelado"],t.estado)}</select></label>
    ${EMPS().length?`<label class="f" for="f_prof">Profesional<select class="in" id="f_prof" name="profesional">${opts(EMPS(),t.profesional||"")}</select></label>`:""}
    <label class="chk"><input type="checkbox" name="cobrar" ${t.estado==="Asistió"?"":"checked"}> Si vino, abrir el cobro con ticket</label>`,
    async d=>{ const ch={estado:d.estado};
      if(d.profesional && d.profesional!==(t.profesional||"")){ if(ocupado(d.profesional,t.fecha,t.hora,t.duracion,t)) throw new Error(d.profesional+" ya tiene un turno a esa hora."); ch.profesional=d.profesional; }
      await api.update("TURNOS",{fecha:f,hora:h,cliente:c},ch); Object.assign(t,ch);
      if(d.estado==="Asistió" && d.cobrar){ const sv=(C().servicios||[]).find(x=>x.nombre===t.servicio);
        setTimeout(()=>openVenta({items:[{n:t.servicio,p:Number(t.precio)||(sv?sv.precio:0),q:1,stock:false}], cliente:t.cliente, wa:t.whatsapp, desc:Number(t.sena)||"", emp:t.profesional||"", from:"Turno "+dmy(t.fecha)+" "+t.hora}),80); }
      return "Turno actualizado"; });
}
function avisoTurno(x){

/* ---------------- tickets (comprobantes) ---------------- */
function ticketData(row){
  const f=fiadoEstado().find(c=>c.cliente===row.cliente)||{saldo:0};
  const n=S.fiadoMov.indexOf(row)+1;
  const pago=row.tipo==="Pago";
  return {titulo: pago?"RECIBO DE PAGO":"COMPROBANTE DE FIADO", numero:String(n).padStart(5,"0"), fecha:dmy(row.fecha)+"/"+String(parseD(row.fecha).getFullYear()),
    cliente:row.cliente, items:[[row.detalle||(pago?"Pago a cuenta":"Compra"), (pago?"− ":"")+fmt(row.monto)]], total:(pago?"Pagó ":"Total ")+fmt(row.monto),

    items:mv.map(m=>[dmy(m.fecha)+" "+(m.tipo==="Pago"?"Pago":"Fiado")+(m.detalle?" · "+m.detalle:""), (m.tipo==="Pago"?"− ":"")+fmt(m.monto)]),

    texto:`${S.config.negocio}\nEstado de cuenta de ${cliente} al ${dmy(iso(today()))}\n`+mv.map(m=>`${dmy(m.fecha)} ${m.tipo}: ${fmt(m.monto)}`).join("\n")+`\nSaldo pendiente: ${fmt(Math.max(0,f.saldo))}`};

async function ticketPNG(t){
  const W=560, lh=30, rows=t.items.length; const H=250+rows*lh+(t.saldo?lh:0)+(t.emisor?24:0);
  const c=document.createElement("canvas"); c.width=W*2; c.height=H*2; const x=c.getContext("2d"); x.scale(2,2);
  x.fillStyle="#fff"; x.fillRect(0,0,W,H); x.fillStyle="#000A3F"; x.fillRect(0,0,W,70);
  try{ const im=new Image(); im.src=S.config.logo||DEFAULT_LOGO; await im.decode(); x.fillStyle="#fff"; x.fillRect(16,11,48,48); x.drawImage(im,18,13,44,44);}catch(e){}
  x.fillStyle="#fff"; x.font="bold 20px Figtree, Arial"; x.fillText(S.config.negocio,76,34); x.font="13px Figtree, Arial"; x.fillText(t.titulo+(t.numero?" · N° "+t.numero:""),76,54);
  x.fillStyle="#111"; x.font="15px Figtree, Arial"; let y=104;
  if(t.emisor){ x.font="12px Figtree, Arial"; x.fillStyle="#555"; x.fillText(t.emisor.length>80?t.emisor.slice(0,79)+"…":t.emisor,24,y-8); x.fillStyle="#111"; y+=18; }
  const line=(a,b,bold)=>{ x.font=(bold?"bold ":"")+"15px Figtree, Arial"; x.textAlign="left"; x.fillText(a,24,y); if(b){x.textAlign="right"; x.fillText(b,W-24,y); x.textAlign="left";} y+=lh; };
  line("Fecha",t.fecha,true); line("Cliente",t.cliente,true);
  x.strokeStyle="#9AA6B2"; x.setLineDash([5,4]); x.beginPath(); x.moveTo(24,y-14); x.lineTo(W-24,y-14); x.stroke(); y+=6;
  t.items.forEach(([a,b])=>line(a.length>44?a.slice(0,43)+"…":a,b));
  x.beginPath(); x.moveTo(24,y-14); x.lineTo(W-24,y-14); x.stroke(); y+=8;
  x.font="bold 22px Figtree, Arial"; x.fillText(t.total,24,y); y+=lh; if(t.saldo){ x.font="15px Figtree, Arial"; x.fillText(t.saldo,24,y); y+=lh; }
  x.font="11px Figtree, Arial"; x.fillStyle="#6B7280"; x.textAlign="center"; x.fillText("Documento no válido como factura · Kit Orden by NEXOVAR",W/2,H-18);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
function openTicketView(t){
  $("#modal").innerHTML = `<div class="scrim" id="scrim"><div class="sheet"><h3>${esc(t.titulo==="ESTADO DE CUENTA"?"Estado de cuenta":t.titulo==="PRESUPUESTO"?"Presupuesto para el cliente":"Ticket para el cliente")}</h3>${ticketHTML(t)}

const numF = v => { const n=Number(String(v??"").trim().replace(/\./g,"").replace(",",".").replace(/[^\d.-]/g,"")); return isFinite(n)?n:0; };
const pad5 = n => String(n).padStart(5,"0");
const toMin = h => { const [a,b]=String(h||"0:0").split(":").map(Number); return (a||0)*60+(b||0); };
const fromMin = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const EMPS = () => (S.config.empleados||[]).filter(Boolean);
const SCAN_OK = "BarcodeDetector" in window;
function norm(d){
  d.recibos=d.recibos||[]; d.config.empleados=d.config.empleados||[];
  d.config.servicios=(d.config.servicios||[]).map(s=>({minutos:30,...s, minutos:Number(s.minutos)||30}));
  d.config.modulos=Object.assign({recibos:true},d.config.modulos||{});
  d.turnos.forEach(t=>{ t.duracion=Number(t.duracion)||((d.config.servicios.find(s=>s.nombre===t.servicio)||{}).minutos)||30; });
  return d;
}
function nextNum(){ return S.recibos.reduce((m,r)=>Math.max(m,Number(r.numero)||0),0)+1; }
function parseItems(concepto){
  return String(concepto||"").split(" · ").map(p=>{
    const m=p.match(/^([\d.,]+) x (.+) @(-?[\d.]+)$/); if(m) return {q:numF(m[1]), n:m[2], p:Number(m[3])};
    const d=p.match(/^Descuento (-?[\d.]+)$/); if(d) return {q:1, n:"Descuento", p:Number(d[1]), desc:true};
    return p?{q:1,n:p,p:null}:null;
  }).filter(Boolean);
}

const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function cartTotals(){
  const sub=CART.items.reduce((a,i)=>a+i.q*i.p,0);
  const dv=String($("#vDesc")?.value||"").trim(); let desc=0;
  if(dv.endsWith("%")) desc=Math.round(sub*numF(dv.slice(0,-1))/100); else desc=numF(dv);
  desc=Math.max(0,Math.min(desc,sub));
  return {sub, desc, total:Math.max(0,sub-desc)};
}
function drawCart(){
  if(!CART) return; const t=cartTotals();
  $("#vCart").innerHTML=CART.items.length?CART.items.map((i,k)=>`<div class="ci"><div class="m"><b>${esc(i.n)}</b><span class="num">${fmt(i.q*i.p)}</span></div>
    <input class="in num pr" data-cp="${k}" value="${i.p}" inputmode="decimal" aria-label="Precio de ${esc(i.n)}">
    <div class="step"><button type="button" data-cq="${k}|-1" aria-label="Uno menos">−</button><b class="num">${fmtQ(i.q)}</b><button type="button" data-cq="${k}|1" aria-label="Uno más">+</button></div></div>`).join("")
    :`<div class="empty" style="padding:14px">Buscá un producto o servicio para empezar.</div>`;
  $("#vTot").innerHTML=fmt(t.total)+(t.desc?`<small class="mini" style="display:block;text-align:right">descuento −${fmt(t.desc)}</small>`:"");
  const pres=CART.tipo==="presupuesto"; $("#vOk").textContent=pres?"Guardar presupuesto":"Cobrar "+fmt(t.total);
  $("#vFacW").hidden=pres;
}
async function guardarVenta(){
  if(!CART.items.length) throw new Error("Agregá al menos un producto o servicio.");
  const t=cartTotals(); if(t.total<=0 && CART.tipo!=="presupuesto") throw new Error("El total tiene que ser mayor a cero.");
  const pres=CART.tipo==="presupuesto", medio=$("#vMedio").value, fiado=!pres&&medio==="Fiado";
  let cliente=$("#vCli").value.trim(); const wa=$("#vWa").value.replace(/\D/g,""), doc=$("#vDoc").value.trim(), emp=$("#vEmp")?.value||"";
  if(fiado && !cliente) throw new Error("Para fiar, poné el nombre del cliente.");
  if(!cliente) cliente="Consumidor final";
  const num=nextNum(), N=pad5(num), hoy=iso(today());
  const parts=CART.items.map(i=>`${fmtQ(i.q)} x ${i.n.replace(/ · /g," - ")} @${i.p}`); if(t.desc) parts.push("Descuento -"+t.desc);
  const rec={numero:num, fecha:hoy, cliente, doc, concepto:parts.join(" · ").slice(0,1500), medio:pres?"":medio, monto:t.total,
    estado:pres?"Presupuesto":($("#vFac").checked?"Facturar":"Emitido"), obs:[emp?"Atendió: "+emp:"", CART.from||""].filter(Boolean).join(" · "), wa};
  const ops=[{sheet:"RECIBOS",row:{fecha:rec.fecha,cliente,doc,concepto:rec.concepto,medio:rec.medio,monto:rec.monto,estado:rec.estado,obs:rec.obs}}];
  const local=[];
  if(!pres){
    if(fiado){
      if(!S.fiadoClientes.some(c=>c.cliente===cliente)){ const nc={cliente,whatsapp:wa,limite:""}; ops.push({sheet:"FIADO",row:nc}); local.push(()=>S.fiadoClientes.push(nc)); }
      const fm={fecha:hoy,cliente,tipo:"Fiado",detalle:"Venta N° "+N,monto:t.total}; ops.push({sheet:"FIADO_MOV",row:fm}); local.push(()=>S.fiadoMov.push(fm));
    } else {
      const soloServ=CART.items.every(i=>!i.stock && (C().servicios||[]).some(s=>s.nombre===i.n));
      const cj={fecha:hoy,tipo:"Ingreso",categoria:soloServ&&C().categorias.includes("Servicios")?"Servicios":"Ventas",detalle:`Venta N° ${N}${cliente!=="Consumidor final"?" · "+cliente:""}`,medio,monto:t.total};
      ops.push({sheet:"CAJA",row:cj}); local.push(()=>S.caja.push(cj));
    }
    CART.items.filter(i=>i.stock).forEach(i=>{ const sm={fecha:hoy,producto:i.n,tipo:"Salida",cantidad:i.q,nota:"Venta N° "+N}; ops.push({sheet:"STOCK_MOV",row:sm}); local.push(()=>S.stockMov.push(sm)); });
  }
  await api.addMany(ops);
  S.recibos.push(rec); local.forEach(f=>f());
  return rec;
}

  <div class="list">${rows.length?rows.slice(0,80).map(r=>`<button class="it rowbtn" type="button" data-comp="${esc(r.numero)}">
    <div class="ico n num" style="font-size:11px">${pad5(r.numero).slice(-3)}</div>
    <div class="m"><b>${esc(r.cliente)}</b><span>${dmy(r.fecha)} · N° ${pad5(r.numero)} · ${esc(r.medio||"—")}</span><br><span class="chip ${cls[r.estado]||"neu"}">${esc(r.estado==="Facturar"?"Para facturar":r.estado||"Emitido")}</span></div>
    <div class="v num">${fmt(r.monto)}</div></button>`).join(""):`<div class="empty">Todavía no hay comprobantes. Cada venta que cargues con "Nueva venta" genera su ticket numerado.</div>`}</div>
  <p class="mini">Los tickets y presupuestos no son factura. Si el cliente pide factura, marcala al vender y después la hacés en ARCA (Comprobantes en línea) con los datos que copia la app.</p>`;
}
function openComprobante(numero){
  const r=S.recibos.find(x=>String(x.numero)===String(numero)); if(!r) return;
  const facTxt=`Datos para facturar · ${S.config.negocio}\nComprobante interno N° ${pad5(r.numero)} del ${dmy(r.fecha)}\nCliente: ${r.cliente}${r.doc?"\nDNI/CUIT: "+r.doc:""}\nConcepto: ${parseItems(r.concepto).map(i=>i.p==null?i.n:(i.desc?"Descuento":fmtQ(i.q)+" x "+i.n)).join(", ")}\nImporte total: ${Math.round(r.monto)}`;
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet"><h3>${r.estado==="Presupuesto"?"Presupuesto":"Venta"} N° ${pad5(r.numero)}</h3>
    ${ticketHTML(comprobanteData(r))}
    ${r.obs?`<p class="mini">${esc(r.obs)}</p>`:""}
    <div class="btn-row"><button class="btn btn-ghost" type="button" id="cSee">Compartir / imprimir</button>
      ${r.estado==="Presupuesto"?`<button class="btn btn-primary" type="button" id="cConv">Convertir en venta</button>`:`<button class="btn btn-ghost" type="button" id="cFacCopy">Copiar datos para facturar</button>`}</div>
    ${r.estado==="Facturar"?`<div class="card" style="display:grid;gap:8px"><b>Marcar como facturada</b><span class="mini">Hacé la factura en ARCA (Comprobantes en línea) y anotá el número acá.</span>
      <a class="btn btn-ghost" href="https://auth.afip.gob.ar/contribuyente_/login.xhtml" target="_blank" rel="noopener">Abrir ARCA</a>
      <input class="in" id="cFacN" placeholder="Ej: Factura C 00001-00000123"><button class="btn btn-primary" type="button" id="cFacOk">Guardar como facturada</button></div>`:""}
    ${r.estado==="Emitido"?`<button class="btn btn-ghost" type="button" id="cPide">El cliente pidió factura</button>`:""}
    ${["Emitido","Facturar"].includes(r.estado)?`<button class="btn btn-ghost" type="button" id="cAnular" style="color:var(--bad)">Anular venta</button>`:""}
    <p class="err" id="formErr"></p>
    <button class="btn btn-primary" type="button" id="cancel">Listo</button></div></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#cancel").onclick=close; $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") close(); });
  $("#cSee").onclick=()=>openTicketView(comprobanteData(r));
  const setEst=async(estado,obs)=>{ const ch={estado}; if(obs!==undefined) ch.obs=obs; await api.update("RECIBOS",{numero:r.numero},ch); Object.assign(r,ch); };
  if($("#cConv")) $("#cConv").onclick=()=>{ const its=parseItems(r.concepto); const desc=its.filter(i=>i.desc).reduce((a,i)=>a+Math.abs(i.p),0);
    openVenta({items:its.filter(i=>!i.desc&&i.p!=null).map(i=>({n:i.n,p:i.p,q:i.q,stock:S.stock.some(s=>s.producto===i.n)})), cliente:r.cliente==="Consumidor final"?"":r.cliente, desc:desc||"", from:"Presupuesto N° "+pad5(r.numero)}); };
  if($("#cFacCopy")) $("#cFacCopy").onclick=()=>(navigator.clipboard?.writeText(facTxt)||Promise.reject()).then(()=>toast("Datos copiados")).catch(()=>toast("No se pudo copiar"));
  if($("#cFacOk")) $("#cFacOk").onclick=async()=>{ const n=$("#cFacN").value.trim(); if(!n){ $("#formErr").textContent="Anotá el número de factura."; return; }
    try{ await setEst("Facturado",[r.obs,n].filter(Boolean).join(" · ")); close(); render(); toast("Marcada como facturada"); }catch(e){ $("#formErr").textContent=e.message; } };
  if($("#cPide")) $("#cPide").onclick=async()=>{ try{ await setEst("Facturar"); close(); render(); toast("Quedó en Para facturar"); }catch(e){ $("#formErr").textContent=e.message; } };
  if($("#cAnular")) $("#cAnular").onclick=async()=>{
    const b=$("#cAnular"); if(!b.dataset.ok){ b.dataset.ok=1; b.textContent="Tocá de nuevo para confirmar la anulación"; return; }
    try{
      const N=pad5(r.numero), hoy=iso(today()), ops=[], local=[];
      if(r.medio==="Fiado"){ const fm={fecha:hoy,cliente:r.cliente,tipo:"Pago",detalle:"Anulación venta N° "+N,monto:Number(r.monto)}; ops.push({sheet:"FIADO_MOV",row:fm}); local.push(()=>S.fiadoMov.push(fm)); }
      else { const cj={fecha:hoy,tipo:"Ingreso",categoria:"Ventas",detalle:"Anulación venta N° "+N,medio:r.medio||"Efectivo",monto:-Number(r.monto)}; ops.push({sheet:"CAJA",row:cj}); local.push(()=>S.caja.push(cj)); }
      parseItems(r.concepto).filter(i=>i.p!=null&&!i.desc&&S.stock.some(s=>s.producto===i.n)).forEach(i=>{ const sm={fecha:hoy,producto:i.n,tipo:"Entrada",cantidad:i.q,nota:"Anulación venta N° "+N}; ops.push({sheet:"STOCK_MOV",row:sm}); local.push(()=>S.stockMov.push(sm)); });
      await api.addMany(ops); local.forEach(f=>f()); await setEst("Anulado"); close(); render(); toast("Venta anulada: se devolvió el stock y se descontó de la caja");
    }catch(e){ $("#formErr").textContent=e.message; }
  };
}

/* ---------- stock rápido ---------- */
let stockCat="Todas";
function openProducto(nombre){
  const p=stockEstado().find(x=>x.producto===nombre); if(!p) return;
  const cats=[...new Set([...(S.stock.map(x=>x.categoria).filter(Boolean)),"Otros"])];
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet"><h3>${esc(p.producto)}</h3>
    <div class="split"><div class="k"><span>Stock actual</span><b class="num" style="font-size:24px">${fmtQ(p.actual)}</b></div><div class="k"><span>Precio · margen</span><b class="num">${fmt(p.precio)} · ${pct(p.margen)}</b></div></div>
    <label class="f" for="pQ">Cantidad<div class="step big"><button type="button" data-pq="-1" aria-label="Menos">−</button><input class="in num" id="pQ" value="1" inputmode="decimal"><button type="button" data-pq="1" aria-label="Más">+</button></div></label>
    <div class="grid3"><button class="btn btn-ghost" type="button" data-pm="Entrada">+ Entró</button><button class="btn btn-ghost" type="button" data-pm="Salida">− Salió</button><button class="btn btn-ghost" type="button" data-pm="Conteo">= Conté</button></div>
    <p class="mini">"Conté" deja el stock en la cantidad que pusiste (ajusta la diferencia).</p>
    <details class="libre"><summary>Editar precio, costo, mínimo o código</summary>
      <div class="grid2"><label class="f">Costo<input class="in num" id="pCos" value="${esc(p.costo)}" inputmode="decimal"></label><label class="f">Precio de venta<input class="in num" id="pPre" value="${esc(p.precio)}" inputmode="decimal"></label>
      <label class="f">Mínimo para pedir<input class="in num" id="pMin" value="${esc(p.minimo)}" inputmode="numeric"></label><label class="f">Código de barras<input class="in num" id="pCod" value="${esc(p.codigo||"")}" inputmode="numeric"></label></div>
      <label class="f">Categoría<input class="in" id="pCat" list="pCatL" value="${esc(p.categoria||"")}"><datalist id="pCatL">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <button class="btn btn-ghost" type="button" id="pSave">Guardar cambios</button></details>
    <p class="err" id="formErr"></p>
    <button class="btn btn-primary" type="button" id="cancel">Cerrar</button></div></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#cancel").onclick=close; $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") close(); });
  $("#scrim").addEventListener("click",async e=>{
    const b=e.target.closest("[data-pq]"); if(b){ const i=$("#pQ"); i.value=Math.max(0,numF(i.value)+Number(b.dataset.pq)); return; }
    const m=e.target.closest("[data-pm]"); if(!m) return;
    const q=numF($("#pQ").value); let tipo=m.dataset.pm, cant=q;
    if(tipo==="Conteo"){ cant=Math.round((q-p.actual)*100)/100; tipo="Ajuste"; if(!cant){ toast("El stock ya está en "+fmtQ(q)); return; } }
    else if(!q||q<0){ $("#formErr").textContent="Poné una cantidad."; return; }
    const row={fecha:iso(today()),producto:p.producto,tipo,cantidad:cant,nota:tipo==="Ajuste"?"Conteo":""};
    try{ await api.add("STOCK_MOV",row); S.stockMov.push(row); close(); render(); toast("Stock de "+p.producto+" actualizado"); }catch(err){ $("#formErr").textContent=err.message; }
  });
  $("#pSave").onclick=async()=>{
    const ch={costo:numF($("#pCos").value),precio:numF($("#pPre").value),minimo:numF($("#pMin").value),codigo:$("#pCod").value.trim(),categoria:$("#pCat").value.trim()||"Otros"};
    if(!ch.precio){ $("#formErr").textContent="Poné un precio de venta."; return; }
    try{ await api.update("STOCK",{producto:p.producto},ch); Object.assign(S.stock.find(x=>x.producto===p.producto),ch); close(); render(); toast("Producto actualizado"); }catch(err){ $("#formErr").textContent=err.message; }
  };
}
function openPedido(){
  const st=stockEstado().sort((a,b)=>({"SIN STOCK":0,"REPONER":1,"OK":2}[a.estado]-({"SIN STOCK":0,"REPONER":1,"OK":2}[b.estado]))||a.producto.localeCompare(b.producto));
  sheet("Llegó un pedido", `<p class="mini" style="margin:0">Poné solo las cantidades que llegaron. Primero aparecen los que había que reponer.</p>
    <input class="in" id="pdQ" placeholder="Buscar producto">
    <div class="list pedido">${st.map((p,i)=>`<div class="it" data-pn="${esc(p.producto.toLowerCase())}"><div class="m"><b>${esc(p.producto)}</b><span>Hay ${fmtQ(p.actual)} · mín. ${p.minimo} · costo ${fmt(p.costo)}</span></div><input class="in num q" name="q${i}" inputmode="decimal" placeholder="0" data-cost="${Number(p.costo)||0}" aria-label="Cantidad de ${esc(p.producto)}"></div>`).join("")}</div>
    <label class="f" for="pdNota">Nota<input class="in" id="pdNota" name="nota" placeholder="Pedido distribuidora"></label>
    <label class="chk"><input type="checkbox" name="caja" id="pdCaja" checked> Anotar el pago en Caja (<span id="pdTot" class="num">$ 0</span> a costo)</label>
    <label class="f" for="pdMedio">Pagado con<select class="in" id="pdMedio" name="medio">${opts(C().medios,"Transferencia")}</select></label>`,
    async d=>{ const hoy=iso(today()), ops=[], local=[]; let tot=0;
      st.forEach((p,i)=>{ const q=numF(d["q"+i]); if(q>0){ const sm={fecha:hoy,producto:p.producto,tipo:"Entrada",cantidad:q,nota:d.nota||"Pedido"}; ops.push({sheet:"STOCK_MOV",row:sm}); local.push(()=>S.stockMov.push(sm)); tot+=q*(Number(p.costo)||0); } });
      if(!ops.length) throw new Error("Poné al menos una cantidad.");
      if(d.caja && tot>0){ const cj={fecha:hoy,tipo:"Egreso",categoria:C().categorias.includes("Mercadería / proveedores")?"Mercadería / proveedores":(egresoCats()[0]||"Otros gastos"),detalle:d.nota||"Pedido de mercadería",medio:d.medio,monto:Math.round(tot)}; ops.push({sheet:"CAJA",row:cj}); local.push(()=>S.caja.push(cj)); }
      await api.addMany(ops); local.forEach(f=>f()); return `Stock cargado (${ops.filter(o=>o.sheet==="STOCK_MOV").length} productos)`; });
  const upd=()=>{ $("#pdTot").textContent=fmt($$(".pedido .q").reduce((a,i)=>a+numF(i.value)*Number(i.dataset.cost),0)); };
  $(".pedido").addEventListener("input",upd);
  $("#pdQ").addEventListener("input",e=>{ const t=e.target.value.trim().toLowerCase(); $$(".pedido [data-pn]").forEach(r=>r.hidden=!!t&&!r.dataset.pn.includes(t)); });
}
function openPrecios(){
  const cats=["Todas",...new Set(S.stock.map(x=>x.categoria).filter(Boolean))];
  sheet("Actualizar precios", `<p class="mini" style="margin:0">Sube (o baja, con signo menos) el precio de venta de varios productos de una vez.</p>
    <div class="grid2"><label class="f" for="prCat">Categoría<select class="in" id="prCat" name="cat">${opts(cats)}</select></label>
    <label class="f" for="prPct">Porcentaje<input class="in num" id="prPct" name="pct" inputmode="decimal" placeholder="Ej: 8" required></label></div>
    <div class="grid2"><label class="f" for="prRed">Redondear a<select class="in" id="prRed" name="red"><option value="1">Sin redondeo</option><option value="10">$ 10</option><option value="50" selected>$ 50</option><option value="100">$ 100</option></select></label>
    <label class="chk" style="align-self:end"><input type="checkbox" name="costo"> También el costo</label></div>`,
    async d=>{ const p=numF(d.pct); if(!p) throw new Error("Poné un porcentaje."); const r=Number(d.red)||1;
      const prods=S.stock.filter(x=>d.cat==="Todas"||x.categoria===d.cat); if(!prods.length) throw new Error("No hay productos en esa categoría.");
      const items=prods.map(x=>{ const ch={precio:Math.max(r,Math.round(Number(x.precio)*(1+p/100)/r)*r)}; if(d.costo) ch.costo=Math.round(Number(x.costo)*(1+p/100)); return {sheet:"STOCK",key:{producto:x.producto},changes:ch,ref:x}; });
      await api.updateMany(items.map(({sheet,key,changes})=>({sheet,key,changes}))); items.forEach(i=>Object.assign(i.ref,i.changes));
      return `Precios actualizados (${items.length} productos)`; });
}
let _scan=null;
function stopScan(){ if(_scan){ _scan.stop=true; try{ _scan.stream.getTracks().forEach(t=>t.stop()); }catch(e){} _scan=null; } const o=$("#scanOv"); if(o) o.remove(); }
async function openScanner(cb, keep){
  if(!SCAN_OK){ toast("Tu celular no permite escanear desde acá: escribí el código"); return; }
  const ov=document.createElement("div"); ov.id="scanOv"; ov.className="scanov";
  ov.innerHTML=`<video playsinline muted></video><div class="frame"></div><p>Apuntá al código de barras</p><button class="btn btn-ghost" type="button">Cerrar</button>`;
  document.body.appendChild(ov); ov.querySelector("button").onclick=stopScan;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=ov.querySelector("video"); v.srcObject=stream; await v.play();
    const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]});
    _scan={stream,stop:false}; let last="";
    const loop=async()=>{ if(!_scan||_scan.stop) return; try{ const r=await det.detect(v); if(r.length && r[0].rawValue!==last){ last=r[0].rawValue; if(navigator.vibrate) navigator.vibrate(60); if(!keep) stopScan(); cb(last); setTimeout(()=>{last="";},1500); } }catch(e){} requestAnimationFrame(loop); };
    loop();
  }catch(e){ stopScan(); toast("No se pudo abrir la cámara"); }
}
function scanStock(){
  openScanner(code=>{ const p=S.stock.find(x=>String(x.codigo||"")===code); if(p) openProducto(p.producto); else { openAdd("producto"); setTimeout(()=>{ const i=$("#f_cod"); if(i) i.value=code; },80); toast("Código nuevo: cargá el producto"); } });
}

/* ---------- turnos con profesionales ---------- */
let turnoProf="Todos";
function ocupado(prof, fecha, hora, dur, skip){
  const a=toMin(hora), b=a+(Number(dur)||30);
  return S.turnos.some(t=>t!==skip && t.fecha===fecha && (t.profesional||"")===(prof||"") && !["Cancelado","Ausente"].includes(t.estado) && toMin(t.hora)<b && a<toMin(t.hora)+(Number(t.duracion)||30));
}
function asignar(pref, fecha, hora, dur){
  const emps=EMPS(); if(!emps.length) return {prof:""};
  const cand=pref&&pref!=="Cualquiera"?[pref]:emps;
  const libre=cand.find(e=>!ocupado(e,fecha,hora,dur)); if(libre) return {prof:libre};
  for(let m=toMin(hora)+15; m<=22*60; m+=15){ const e=cand.find(x=>!ocupado(x,fecha,fromMin(m),dur)); if(e) return {prof:null, sug:`${fromMin(m)} con ${e}`}; }
  return {prof:null, sug:null};
}
